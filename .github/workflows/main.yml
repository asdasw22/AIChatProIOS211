name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "ios/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build TelegramPhotoDrive
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_PATH: ios/TelegramPhotoDrive.xcodeproj
      SCHEME: TelegramPhotoDrive
      CONFIGURATION: Release
      BUILD_ROOT: build/ci
      DERIVED_DATA_PATH: build/ci/DerivedData
      ARCHIVE_PATH: build/ci/TelegramPhotoDrive.xcarchive
      IPA_OUTPUT_PATH: build/ci/ipa
      BUNDLE_IDENTIFIER: com.youssef.telegramphotodrive
      APPLE_TEAM_ID: YOUSSEFTEAM
      TELEGRAM_CHAT_ID: "8708103807"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: List Xcode project schemes
        run: |
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Prepare build directories
        run: |
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT" "$IPA_OUTPUT_PATH"

      - name: Build app without code signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee "$BUILD_ROOT/xcodebuild-build.log"

      - name: Archive app without code signing if possible
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee "$BUILD_ROOT/xcodebuild-archive.log"

      - name: Package unsigned IPA artifact
        run: |
          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Build may have failed."
            exit 1
          fi

          PACKAGE_ROOT="$BUILD_ROOT/package"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/Payload" "$IPA_OUTPUT_PATH"
          cp -R "$APP_PATH" "$PACKAGE_ROOT/Payload/"

          cd "$PACKAGE_ROOT"
          /usr/bin/zip -qry "../ipa/TelegramPhotoDrive-unsigned.ipa" Payload
          cd -

          ls -la "$IPA_OUTPUT_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPhotoDrive-unsigned-ipa
          path: build/ci/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
